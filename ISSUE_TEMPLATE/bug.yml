name: 🐛 Reportar un error
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué ocurre
      description: Describe el error con claridad.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ve a...
        2. Pulsa en...
        3. Aparece el error...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
  - type: input
    id: entorno
    attributes:
      label: Navegador / dispositivo
      placeholder: Chrome en Windows, Safari en iPhone...
  - type: textarea
    id: capturas
    attributes:
      label: Capturas
      description: Si ayudan, arrástralas aquí.
